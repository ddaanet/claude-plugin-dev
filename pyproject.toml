# Dev tooling only; nothing here is a Python package, and none of it ships --
# `toolkit/` is the shipped boundary and this file sits outside it. `uv sync`
# materializes `.venv/bin`, which `.envrc` puts on PATH; `just format-docs`
# then calls a bare `rumdl` off PATH. PyYAML is here for
# tests/check-frontmatter-*-test.sh, which run toolkit/check-frontmatter.sh
# against the venv's python3.
[project]
name = "claude-plugin-dev-tools"
version = "0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pyyaml>=6", "rumdl==0.2.60"]

[tool.uv]
package = false
